services:
  - type: web
    name: santhosh-neon-rush
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && gunicorn myproject.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: santhosh-neon-rush.onrender.com
